<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestionHotel - Système de Réservation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .auth-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .room-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .room-card:hover {
            transform: translateY(-5px);
        }

        .room-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }

        .room-info {
            margin-bottom: 20px;
        }

        .room-info span {
            display: inline-block;
            background: #f8f9fa;
            padding: 5px 12px;
            border-radius: 20px;
            margin: 2px;
            font-size: 14px;
        }

        .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 15px;
        }

        .reservation-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 30px;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left-color: #28a745;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-left-color: #dc3545;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left-color: #17a2b8;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <button class="logout-btn" onclick="logout()" style="display: none;" id="logoutBtn">
        Déconnexion
    </button>

    <div class="header">
        <h1>🏨 GestionHotel</h1>
        <p>Système de gestion hôtelière moderne</p>
    </div>

    <!-- Section d'authentification -->
    <div class="auth-section" id="authSection">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">🔍 Rechercher</button>
            <button class="tab" onclick="switchTab('login')">🔐 Connexion</button>
            <button class="tab" onclick="switchTab('register')">📝 Inscription</button>
        </div>

        <!-- Recherche de chambres -->
        <div id="search" class="tab-content active">
            <h2>Rechercher des chambres disponibles</h2>
            <form onsubmit="searchRooms(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Date d'arrivée</label>
                        <input type="date" id="dateDebut" required>
                    </div>
                    <div class="form-group">
                        <label>Date de départ</label>
                        <input type="date" id="dateFin" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre de personnes</label>
                        <select id="nombrePersonnes">
                            <option value="">Peu importe</option>
                            <option value="1">1 personne</option>
                            <option value="2">2 personnes</option>
                            <option value="3">3 personnes</option>
                            <option value="4">4 personnes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Type de chambre</label>
                        <select id="typeChambre">
                            <option value="">Tous types</option>
                            <option value="Simple">Simple</option>
                            <option value="Double">Double</option>
                            <option value="Suite">Suite</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Rechercher</button>
            </form>
        </div>

        <!-- Connexion -->
        <div id="login" class="tab-content">
            <h2>Connexion</h2>
            <form onsubmit="login(event)">
                <div class="form-group">
                    <label>Nom d'utilisateur</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
        </div>

        <!-- Inscription -->
        <div id="register" class="tab-content">
            <h2>Inscription</h2>
            <form onsubmit="register(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nom d'utilisateur</label>
                        <input type="text" id="regUsername" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="regEmail" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="regPassword" required>
                    </div>
                    <div class="form-group">
                        <label>Rôle</label>
                        <select id="regRole" required>
                            <option value="Client">Client</option>
                            <option value="Receptionniste">Réceptionniste</option>
                            <option value="PersonnelMenage">Personnel Ménage</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">S'inscrire</button>
            </form>
        </div>
    </div>

    <!-- Dashboard utilisateur connecté -->
    <div class="dashboard" id="dashboard">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalReservations">0</div>
                <div>Réservations</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalAmount">0€</div>
                <div>Total dépensé</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pendingTasks">0</div>
                <div>Tâches en attente</div>
            </div>
        </div>
    </div>

    <!-- Section de réservation -->
    <div class="reservation-section" id="reservationSection" style="display: none;">
        <h2>Effectuer une réservation</h2>
        <form onsubmit="makeReservation(event)">
            <div class="form-group">
                <label>Client ID (simulé)</label>
                <input type="number" id="clientId" value="1" required>
            </div>
            <div class="form-group">
                <label>Chambres sélectionnées</label>
                <input type="text" id="selectedRooms" readonly>
            </div>
            <div class="form-group">
                <label>Commentaires</label>
                <input type="text" id="comments" placeholder="Commentaires optionnels">
            </div>
            <button type="submit" class="btn btn-primary">Confirmer la réservation</button>
        </form>
    </div>

    <!-- Loading spinner -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Chargement en cours...</p>
    </div>

    <!-- Résultats de recherche -->
    <div id="results"></div>
</div>

<script>
    const API_BASE = 'http://localhost:5000/api';
    let currentUser = null;
    let authToken = null;
    let selectedRoomIds = [];

    // Configuration des dates par défaut
    document.addEventListener('DOMContentLoaded', function() {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const nextWeek = new Date(today);
        nextWeek.setDate(nextWeek.getDate() + 7);

        document.getElementById('dateDebut').value = tomorrow.toISOString().split('T')[0];
        document.getElementById('dateFin').value = nextWeek.toISOString().split('T')[0];
    });

    function switchTab(tabName) {
        // Cacher tous les contenus d'onglets
        document.querySelectorAll('.tab-content').forEach(content => {
            content.classList.remove('active');
        });

        // Désactiver tous les onglets
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.remove('active');
        });

        // Activer l'onglet sélectionné
        document.getElementById(tabName).classList.add('active');
        event.target.classList.add('active');
    }

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
    }

    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    function showAlert(message, type = 'info') {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = message;

        const results = document.getElementById('results');
        results.insertBefore(alertDiv, results.firstChild);

        setTimeout(() => {
            alertDiv.remove();
        }, 5000);
    }

    async function searchRooms(event) {
        event.preventDefault();
        showLoading();

        const dateDebut = document.getElementById('dateDebut').value;
        const dateFin = document.getElementById('dateFin').value;
        const nombrePersonnes = document.getElementById('nombrePersonnes').value;
        const typeChambre = document.getElementById('typeChambre').value;

        const queryParams = new URLSearchParams({
            dateDebut,
            dateFin,
            ...(nombrePersonnes && { nombrePersonnes }),
            ...(typeChambre && { typeChambre })
        });

        try {
            const response = await fetch(`${API_BASE}/booking/available-rooms?${queryParams}`);
            const data = await response.json();

            hideLoading();

            if (data.success) {
                displayRooms(data.availableRooms);
                showAlert('Chambres trouvées avec succès!', 'success');
            } else {
                showAlert('Erreur lors de la recherche: ' + data.message, 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erreur:', error);
            showAlert('Erreur de connexion au serveur', 'error');
            // Afficher des données de démonstration
            displayDemoRooms();
        }
    }

    function displayDemoRooms() {
        const demoRooms = {
            rooms: [
                { id: 1, numero: "101", type: "Simple", tarif: 80, capacite: 1 },
                { id: 2, numero: "102", type: "Double", tarif: 120, capacite: 2 },
                { id: 3, numero: "201", type: "Suite", tarif: 200, capacite: 4 }
            ]
        };
        displayRooms(demoRooms);
    }

    function displayRooms(roomsData) {
        const results = document.getElementById('results');

        if (!roomsData || !roomsData.rooms || roomsData.rooms.length === 0) {
            results.innerHTML = '<div class="alert alert-info">Aucune chambre disponible pour ces dates.</div>';
            return;
        }

        const roomsHTML = roomsData.rooms.map(room => `
                <div class="room-card">
                    <h3>Chambre ${room.numero}</h3>
                    <div class="room-info">
                        <span>Type: ${room.type}</span>
                        <span>Capacité: ${room.capacite} personne(s)</span>
                        <span>État: Disponible</span>
                    </div>
                    <div class="price">${room.tarif}€ / nuit</div>
                    <button class="btn btn-primary" onclick="selectRoom(${room.id}, '${room.numero}', ${room.tarif})">
                        Sélectionner
                    </button>
                </div>
            `).join('');

        results.innerHTML = `
                <h2>Chambres disponibles</h2>
                <div class="rooms-grid">${roomsHTML}</div>
            `;
    }

    function selectRoom(roomId, roomNumber, price) {
        if (!selectedRoomIds.includes(roomId)) {
            selectedRoomIds.push(roomId);
            showAlert(`Chambre ${roomNumber} sélectionnée (${price}€/nuit)`, 'success');
            updateSelectedRooms();
            showReservationSection();
        } else {
            showAlert('Cette chambre est déjà sélectionnée', 'info');
        }
    }

    function updateSelectedRooms() {
        document.getElementById('selectedRooms').value = selectedRoomIds.join(', ');
    }

    function showReservationSection() {
        document.getElementById('reservationSection').style.display = 'block';
        document.getElementById('reservationSection').scrollIntoView({ behavior: 'smooth' });
    }

    async function makeReservation(event) {
        event.preventDefault();

        if (selectedRoomIds.length === 0) {
            showAlert('Veuillez sélectionner au moins une chambre', 'error');
            return;
        }

        showLoading();

        const reservationData = {
            clientId: parseInt(document.getElementById('clientId').value),
            dateDebut: document.getElementById('dateDebut').value,
            dateFin: document.getElementById('dateFin').value,
            chambresIds: selectedRoomIds,
            commentaires: document.getElementById('comments').value
        };

        try {
            const response = await fetch(`${API_BASE}/booking`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(authToken && { 'Authorization': `Bearer ${authToken}` })
                },
                body: JSON.stringify(reservationData)
            });

            const data = await response.json();
            hideLoading();

            if (data.success) {
                showAlert(`Réservation créée avec succès! ID: ${data.reservationId}`, 'success');
                selectedRoomIds = [];
                updateSelectedRooms();
                document.getElementById('reservationSection').style.display = 'none';

                // Proposer le paiement
                if (confirm('Voulez-vous procéder au paiement maintenant?')) {
                    showPaymentForm(data.reservationId, 150); // Montant simulé
                }
            } else {
                showAlert('Erreur lors de la réservation: ' + data.message, 'error');
            }
        } catch (error) {
            hideLoading();
            console.error('Erreur:', error);
            // Simulation de succès pour la démo
            const reservationId = Math.floor(Math.random() * 9000) + 1000;
            showAlert(`Réservation créée avec succès! ID: ${reservationId} (Mode démonstration)`, 'success');

            if (confirm('Voulez-vous procéder au paiement maintenant?')) {
                showPaymentForm(reservationId, 150);
            }
        }
    }

    function showPaymentForm(reservationId, amount) {
        const paymentHTML = `
                <div class="reservation-section">
                    <h2>Paiement - Réservation #${reservationId}</h2>
                    <form onsubmit="processPayment(event, ${reservationId}, ${amount})">
                        <div class="form-group">
                            <label>Montant à payer</label>
                            <input type="text" value="${amount}€" readonly>
                        </div>
                        <div class="form-group">
                            <label>Numéro de carte</label>
                            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Date d'expiration</label>
                                <input type="text" id="expiryDate" placeholder="MM/AA" maxlength="5" required>
                            </div>
                            <div class="form-group">
                                <label>CVV</label>
                                <input type="text" id="cvv" placeholder="123" maxlength="3" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Nom du porteur</label>
                            <input type="text" id="cardHolder" placeholder="JEAN DUPONT" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Payer ${amount}€</button>
                        <button type="button" class="btn btn-secondary" onclick="this.closest('div').remove()">Annuler</button>
                    </form>
                </div>
            `;

        document.getElementById('results').insertAdjacentHTML('beforeend', paymentHTML);
    }

    async function processPayment(event, reservationId, amount) {
        event.preventDefault();
        showLoading();

        const paymentData = {
            montant: amount,
            methodePaiement: "CarteBancaire",
            numeroCarte: document.getElementById('cardNumber').value,
            nomPorteur: document.getElementById('cardHolder').value,
            dateExpiration: document.getElementById('expiryDate').value,
            codeCVV: document.getElementById('cvv').value
        };

        try {
            const response = await fetch(`${API_BASE}/booking/${reservationId}/payment`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(authToken && { 'Authorization': `Bearer ${authToken}` })
                },
                body: JSON.stringify(paymentData)
            });

            const data = await response.json();
            hideLoading();

            if (data.success) {
                showAlert(`Paiement réussi! Transaction: ${data.paymentResult?.transactionId || 'DEMO'}`, 'success');
                event.target.closest('div').remove();
            } else {
                showAlert('Échec du paiement: ' + data.message, 'error');
            }
        } catch (error) {
            hideLoading();
            // Simulation pour la démo (95% de succès)
            const success = Math.random() > 0.05;
            if (success) {
                showAlert(`Paiement réussi! Transaction: DEMO_${Date.now()}`, 'success');
                event.target.closest('div').remove();
            } else {
                showAlert('Échec du paiement: Fonds insuffisants (simulation)', 'error');
            }
        }
    }

    async function login(event) {
        event.preventDefault();
        showLoading();

        const loginData = {
            nomUtilisateur: document.getElementById('loginUsername').value,
            motDePasse: document.getElementById('loginPassword').value
        };

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginData)
            });

            const data = await response.json();
            hideLoading();

            if (data.success) {
                authToken = data.token;
                currentUser = data.user;
                showAlert('Connexion réussie!', 'success');
                showDashboard();
            } else {
                showAlert('Erreur de connexion: ' + data.message, 'error');
            }
        } catch (error) {
            hideLoading();
            // Simulation de connexion pour la démo
            authToken = 'demo_token';
            currentUser = {
                id: 1,
                nomUtilisateur: loginData.nomUtilisateur,
                role: 'Client'
            };
            showAlert('Connexion réussie! (Mode démonstration)', 'success');
            showDashboard();
        }
    }

    async function register(event) {
        event.preventDefault();
        showLoading();

        const registerData = {
            nomUtilisateur: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            motDePasse: document.getElementById('regPassword').value,
            role: document.getElementById('regRole').value
        };

        try {
            const response = await fetch(`${API_BASE}/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registerData)
            });

            const data = await response.json();
            hideLoading();

            if (data) {
                showAlert('Inscription réussie! Vous pouvez maintenant vous connecter.', 'success');
                switchTab('login');
            } else {
                showAlert('Erreur lors de l\'inscription', 'error');
            }
        } catch (error) {
            hideLoading();
            showAlert('Inscription réussie! (Mode démonstration)', 'success');
            switchTab('login');
        }
    }

    function showDashboard() {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
        document.getElementById('logoutBtn').style.display = 'block';

        // Mise à jour des statistiques
        document.getElementById('totalReservations').textContent = '3';
        document.getElementById('totalAmount').textContent = '450€';
        document.getElementById('pendingTasks').textContent = currentUser.role === 'PersonnelMenage' ? '5' : '0';
    }

    function logout() {
        authToken = null;
        currentUser = null;
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('dashboard').classList.remove('active');
        document.getElementById('logoutBtn').style.display = 'none';
        showAlert('Déconnexion réussie', 'info');
    }

    // Formatage automatique des champs de paiement
    document.addEventListener('input', function(e) {
        if (e.target.id === 'cardNumber') {
            let value = e.target.value.replace(/\s/g, '').replace(/[^0-9]/gi, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
        }

        if (e.target.id === 'expiryDate') {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value;
        }

        if (e.target.id === 'cvv') {
            e.target.value = e.target.value.replace(/\D/g, '');
        }
    });

    // Animation d'entrée
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.header').style.animation = 'fadeInDown 1s ease-out';
        document.querySelector('.auth-section').style.animation = 'fadeInUp 1s ease-out 0.3s both';
    });

    // Styles d'animation
    const style = document.createElement('style');
    style.textContent = `
            @keyframes fadeInDown {
                from {
                    opacity: 0;
                    transform: translateY(-30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
    document.head.appendChild(style);
</script>
</body>
</html>
